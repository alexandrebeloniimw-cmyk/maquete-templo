<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6db5">
<title>Igreja atual — Maquete 3D</title>
<style>
  :root { --ink:#1f2a37; --muted:#5b6776; --card:rgba(255,255,255,.92); --accent:#2f6db5; --navy:#1f3a5c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); background:#e9eff6; }
  #app { display:flex; width:100%; height:100%; }
  #stage { position:relative; flex:1 1 auto; min-width:0; min-height:0; background:linear-gradient(#cfe0f1,#e6efdc); }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #side { order:-1; flex:0 0 292px; width:292px; background:#fff; border-right:1px solid #dbe3ec; display:flex; flex-direction:column; min-height:0; }
  .top { padding:16px 18px 8px; }
  .top h1 { margin:0; font-size:18px; letter-spacing:.2px; color:var(--navy); }
  .top p { margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.35; }
  .tools { display:flex; flex-wrap:wrap; gap:7px; padding:6px 18px 12px; border-bottom:1px solid #e6ecf3; }
  button { font:inherit; font-size:13.5px; border:0; cursor:pointer; padding:9px 14px; border-radius:999px; background:#eef3f8; color:var(--ink); transition:background .12s, transform .12s; }
  button:hover { background:#e1eaf3; }
  .tools button { flex:1 1 auto; padding:8px 10px; font-size:13px; font-weight:600; }
  button.on { background:var(--accent); color:#fff; }
  #tabs { display:none; }
  #menuPanel { flex:1 1 auto; overflow-y:auto; padding:4px 16px 14px; }
  #menuPanel .note { font-size:12px; color:#4a5f78; background:#f2f6fb; border-radius:10px; padding:8px 10px; margin:10px 0 2px; line-height:1.35; }
  #menuPanel .mt { font-size:11.5px; letter-spacing:.9px; text-transform:uppercase; color:#5b6f86; margin:16px 2px 7px; font-weight:700; }
  #menuPanel .mrow { display:flex; flex-wrap:wrap; gap:6px; }
  #menuPanel button.mv { padding:8px 12px; font-size:13px; border-radius:10px; background:#f3f6fa; border:1px solid #e1e8f0; color:#26384d; }
  #menuPanel button.mv:hover { background:#e6eef7; }
  #menuPanel button.mv.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  #menuPanel button.fpv:after { content:' 👁'; font-size:11px; }
  .hint { padding:9px 18px 12px; font-size:12px; color:#5b6776; border-top:1px solid #e6ecf3; background:#f7f9fc; line-height:1.35; }
  .bar { display:none; }
  @media (max-width:760px){
    #app { flex-direction:column; }
    #stage { flex:1 1 0; }
    #side { order:0; flex:0 0 auto; width:100%; border-right:0; border-top:1px solid #dbe3ec; padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -4px 16px rgba(30,50,80,.08); }
    .top { display:none; }
    .tools { flex-wrap:nowrap; overflow-x:auto; padding:8px 10px 6px; border-bottom:0; scrollbar-width:none; }
    .tools::-webkit-scrollbar, #tabs::-webkit-scrollbar, #menuPanel::-webkit-scrollbar { display:none; }
    .tools button { flex:0 0 auto; padding:7px 14px; font-size:12.5px; }
    #tabs { display:flex; gap:6px; overflow-x:auto; padding:2px 10px 6px; scrollbar-width:none; }
    #tabs button { flex:0 0 auto; padding:7px 13px; font-size:12.5px; font-weight:600; background:#eef3f8; color:#33516f; }
    #tabs button.on { background:var(--navy); color:#fff; }
    #menuPanel { flex:none; overflow-x:auto; overflow-y:hidden; padding:2px 10px 10px; scrollbar-width:none; }
    #menuPanel .mt, #menuPanel .note { display:none; }
    #menuPanel .mrow { display:none; flex-wrap:nowrap; }
    #menuPanel .mrow.show { display:flex; }
    #menuPanel button.mv { flex:0 0 auto; white-space:nowrap; padding:10px 14px; font-size:13px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>
  <aside id="side">
    <div class="top"><h1>Igreja atual · Maquete 3D</h1><p>Anexo, templo, pátio, estacionamentos e entorno</p></div>
    <div class="tools">
  <button id="tRoof" class="on">Telhado</button>
  <button id="tLabels" class="on">Nomes</button>
  <button id="tSpin">Girar</button>
</div>
    <div id="tabs"></div>
    <div id="menuPanel"></div>
    <div class="hint">Arraste para girar · role ou use dois dedos para aproximar</div>
  </aside>
  <div class="bar" id="views"></div>
  <button id="tMenu" hidden></button>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  // ---------- Conversão planta (px) -> mundo (unidades ~ metros) ----------
  var S = 0.02;                       // 50 px da planta = 1 unidade (~1 m)
  function X(px){ return (px - 370) * S; }
  function Z(py){ return (py - 900) * S; }

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  var SMALL = Math.min(window.innerWidth, window.innerHeight) < 700;      // celular: menos carga gráfica
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, SMALL ? 1.25 : 1.5));   // desempenho: limita a resolução interna
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef2f2);
  scene.fog = new THREE.Fog(0xe4ecee, 90, 250);

  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.499;
  controls.minDistance = 1.5;
  controls.maxDistance = 95;
  controls.autoRotateSpeed = 1.2;

  // ---------- Luzes ----------
  // ---------- Céu (com nuvens) e reflexos do ambiente ----------
  var skyCv = document.createElement('canvas'); skyCv.width = 1024; skyCv.height = 512;
  (function(){
    var x = skyCv.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, '#4f86c9'); g.addColorStop(0.25, '#7fb0e3'); g.addColorStop(0.42, '#c4dcf0'); g.addColorStop(0.495, '#eef2f2');
    g.addColorStop(0.505, '#d9e0d3'); g.addColorStop(1, '#a9b79f');
    x.fillStyle = g; x.fillRect(0, 0, 1024, 512);
    var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 26; i++) {
      var cx = 90 + rnd() * 840, cy = 60 + rnd() * 150, w = 50 + rnd() * 110;
      for (var k = 0; k < 9; k++) {
        var ox = (rnd() - 0.5) * w * 1.5, oy = (rnd() - 0.5) * w * 0.28, r = w * (0.35 + rnd() * 0.35);
        var rg = x.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, r);
        rg.addColorStop(0, 'rgba(255,255,255,0.55)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = rg; x.fillRect(cx + ox - r, cy + oy - r, r * 2, r * 2);
      }
    }
  })();
  var skyTex = new THREE.CanvasTexture(skyCv);
  var skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false });
  var skyDome = new THREE.Mesh(new THREE.SphereGeometry(320, 32, 16), skyMat); skyDome.renderOrder = -10; scene.add(skyDome);
  try {
    var envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
    var pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, 0.02).texture; pm.dispose();
  } catch (e) {}

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9fae98, 0.08));
  var sun = new THREE.DirectionalLight(0xffeccf, 0.78);
  sun.position.set(22, 30, 19);
  sun.castShadow = true;
  sun.shadow.mapSize.set(SMALL ? 1024 : 2048, SMALL ? 1024 : 2048);
  var sc = sun.shadow.camera; sc.left = -32; sc.right = 32; sc.top = 34; sc.bottom = -30; sc.near = 1; sc.far = 130;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  var inner = new THREE.PointLight(0xfff0d8, 0.28, 24, 1.5); inner.position.set(0, 3.8, -9.5); scene.add(inner);

  // ---------- Materiais ----------
  var cache = {};
  // textura de reboco/sujeira leve calculada na própria superfície (sem imagens)
  function grain(m){
    m.onBeforeCompile = function(sh){
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;\n' +
        'float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }\n' +
        'float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);\n' +
        ' return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),\n' +
        '            mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }')
        .replace('#include <color_fragment>', '#include <color_fragment>\n' +
        (SMALL ? ' float gn = vn(vWP * 14.0) * 0.9;\n' : ' float gn = vn(vWP * 14.0) * 0.5 + vn(vWP * 45.0) * 0.3 + vn(vWP * 3.0) * 0.35;\n') +
        ' diffuseColor.rgb *= 0.93 + 0.14 * gn;\n' +
        ' vec3 wn = normalize(cross(dFdx(vWP), dFdy(vWP)));\n' +
        ' float vert = 1.0 - step(0.5, abs(wn.y));\n' +
        ' float dirt = (1.0 - smoothstep(0.0, 0.6, vWP.y)) * vert;\n' +
        ' diffuseColor.rgb *= 1.0 - 0.2 * dirt * (0.45 + vn(vWP * 7.0));');
    };
    return m;
  }
  function mat(hex, opts){
    var k = hex + JSON.stringify(opts || {});
    if (!cache[k]) cache[k] = grain(new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.9, metalness: 0, envMapIntensity: 0.55 }, opts || {})));
    return cache[k];
  }
  var C = {
    wall: 0xf3efe6, wallIn: 0xe9e3d6, muro: 0xe6dfd0, trim: 0xb9b2a2,
    anexo: 0xd9d0f0, salaAnexo: 0xe8d9c0, corr: 0xd9d9de, plat1: 0xd2d4d7, plat2: 0xd2d4d7, nave: 0xbfe6dc,
    bath: 0xd9d9de, salaExt: 0xf4a38f, bebedouro: 0xb9d8f2, patio: 0xdfeedd, varanda: 0xf0d3bc,
    grass: 0xc9e0bd, sidewalk: 0xece7dc, street: 0x8e9299, line: 0x5f8f5a, roof: 0x8d9299, wood: 0x8b5e3c, slab: 0xb9b9c3,
    mesa: 0xa9bbd6, white: 0xffffff, grade: 0xffffff, azul: 0x3f78c4, azulClaro: 0x9cc8ee
  };

  var root = new THREE.Group(); scene.add(root);
  var roofGroup = new THREE.Group(); scene.add(roofGroup);
  var labelGroup = new THREE.Group(); scene.add(labelGroup);
  var forroGroup = new THREE.Group(); scene.add(forroGroup);      // forros e luzes (somem junto com o telhado)

  function box(w, h, d, color, x, y, z, parent, o){
    o = o || {};
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), o.material || mat(color, o.mat));
    m.position.set(x, y, z);
    m.castShadow = o.cast !== false; m.receiveShadow = true;
    (parent || root).add(m);
    return m;
  }
  // retângulo da planta -> caixa
  function rect(x1, y1, x2, y2, y0, h, color, o){
    return box((x2 - x1) * S, h, (y2 - y1) * S, color, X((x1 + x2) / 2), y0 + h / 2, Z((y1 + y2) / 2), null, o);
  }

  // ---------- Paredes com aberturas ----------
  var T = 0.16, BH = 3.0, DOORH = 2.1;     // BH = altura padrão das paredes (3 m); porta 2,10 m
  var glass = new THREE.MeshStandardMaterial({ color: 0x9fd0ee, transparent: true, opacity: 0.45, roughness: 0.2, metalness: 0.1 });
  // caixa de parede; color 'HALF' = metade de baixo com ladrilhinhos e metade de cima azul claro
  function wbox(horiz, mid, fixed, len, y0, hh, tt, color, material){
    if (color === 'HALF' && !material){
      [[y0, Math.min(y0 + hh, 1.5), true], [Math.max(y0, 1.5), y0 + hh, false]].forEach(function(q){
        var ph = q[1] - q[0]; if (ph <= 0.001) return;
        var mt = q[2] ? tileMat(len / 0.5, ph / 0.5) : mat(C.azulClaro);
        if (horiz) box(len, ph, tt, 0, X(mid), q[0] + ph / 2, Z(fixed), null, { material: mt });
        else box(tt, ph, len, 0, X(fixed), q[0] + ph / 2, Z(mid), null, { material: mt });
      });
      return null;
    }
    return horiz ? box(len, hh, tt, color, X(mid), y0 + hh / 2, Z(fixed), null, { material: material })
                 : box(tt, hh, len, color, X(fixed), y0 + hh / 2, Z(mid), null, { material: material });
  }
  function opening(horiz, fixed, g, h, color, tt){
    var len = (g.b - g.a) * S, mid = (g.a + g.b) / 2;
    var lh = g.lh || DOORH;
    function piece(y0, y1, material){
      if (y1 <= y0) return;
      var hh = y1 - y0;
      var mesh = wbox(horiz, mid, fixed, len, y0, hh, tt, color, material);
      if (mesh && material === glass) mesh.castShadow = false;
    }
    piece(lh, h, null);
    if (g.sill){ piece(0, g.sill, null); piece(g.sill, lh, glass); }
  }
  function wall(horiz, fixed, a1, a2, h, gaps, color, thick){
    gaps = (gaps || []).slice().sort(function(p, q){ return p.a - q.a; });
    var tt = thick || T, cur = a1;
    function seg(a, b){
      if (b - a <= 0.5) return;
      var len = (b - a) * S, mid = (a + b) / 2;
      wbox(horiz, mid, fixed, len, 0, h, tt, color);
    }
    gaps.forEach(function(g){ seg(cur, g.a); opening(horiz, fixed, g, h, color, tt); cur = g.b; });
    seg(cur, a2);
  }
  function hwall(py, x1, x2, h, gaps, color, thick){ wall(true, py, x1, x2, h, gaps, color || C.wallIn, thick); }
  function vwall(px, y1, y2, h, gaps, color, thick){ wall(false, px, y1, y2, h, gaps, color || C.wallIn, thick); }
  // aberturas padrão: porta 0,90 m (45 px) e janela 1,20 x 1,20 m com peitoril 1,10 m (60 px de largura)
  function door(c){ return { a: c - 22.5, b: c + 22.5, lh: 2.1 }; }
  function win(c){ return { a: c - 30, b: c + 30, sill: 1.1, lh: 2.3 }; }
  // folha de porta de madeira (fechada) e esquadria branca de janela, para as aberturas das salas
  function seg3(horiz, fixed, c, along, h, th, color, y, off){
    off = off || 0;
    if (horiz) box(along, h, th, color, X(c) + off, y, Z(fixed));
    else box(th, h, along, color, X(fixed), y, Z(c) + off);
  }
  function doorLeaf(horiz, fixed, c, w, h, th){
    w = w || 0.86; h = h || 2.08; th = th || 0.2;
    seg3(horiz, fixed, c, w, h, 0.05, C.wood, h / 2);
    [[0.72 * w, 0.37 * h, 0.72 * h], [0.72 * w, 0.37 * h, 0.28 * h]].forEach(function(q){ seg3(horiz, fixed, c, q[0], q[1], 0.075, 0x6e4a2e, q[2]); });
    seg3(horiz, fixed, c, 0.1, 0.03, 0.12, 0xd8c27a, h * 0.48, w / 2 - 0.12);
    seg3(horiz, fixed, c, w + 0.1, 0.06, th, 0x5b3d25, h + 0.04);
    [-1, 1].forEach(function(o){ seg3(horiz, fixed, c, 0.06, h + 0.02, th, 0x5b3d25, h / 2 + 0.01, o * (w / 2 + 0.03)); });
  }
  function winFrame(horiz, fixed, c){
    var y0 = 1.1, y1 = 2.3, yc = (y0 + y1) / 2;
    seg3(horiz, fixed, c, 1.2, 0.05, 0.2, C.white, y0 + 0.025);
    seg3(horiz, fixed, c, 1.2, 0.05, 0.2, C.white, y1 - 0.025);
    [-0.575, 0.575].forEach(function(o){ seg3(horiz, fixed, c, 0.05, 1.2, 0.2, C.white, yc, o); });
    seg3(horiz, fixed, c, 0.04, 1.2, 0.1, C.white, yc);
    seg3(horiz, fixed, c, 1.3, 0.04, 0.3, C.white, y0 - 0.02);
  }

  // ---------- Terreno, calçada e rua ----------
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), mat(C.grass));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; root.add(ground);
  // calçada cinza com blocos (pavers de concreto 0,40 x 0,20 m, assentamento em fiada trocada) entre o portão e a rua
  var swTex = (function(){
    var cv = document.createElement('canvas'); cv.width = 512; cv.height = 256; var g = cv.getContext('2d');
    g.fillStyle = '#8f9396'; g.fillRect(0, 0, 512, 256);
    var tones = ['#c9cbce', '#bfc1c4', '#cdcfd2', '#c4c6c9', '#b9bcbf'], bw = 128, bh = 64, sd = 5;
    function rn(){ sd = (sd * 16807) % 2147483647; return sd / 2147483647; }
    for (var r = 0; r < 4; r++){ for (var c = -1; c < 5; c++){
      var x = c * bw + (r % 2 ? bw / 2 : 0), y = r * bh; g.fillStyle = tones[Math.floor(rn() * tones.length)]; g.fillRect(x + 3, y + 3, bw - 6, bh - 6);
      g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x + 3, y + 3, bw - 6, 4);
    } }
    var t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(50, 2.675); t.anisotropy = 4; return t;
  })();
  box(80, 0.06, (1870 - 1763) * S, 0, 0, 0.0, Z((1763 + 1870) / 2), null, { cast: false, material: new THREE.MeshStandardMaterial({ map: swTex, roughness: 0.95 }) });
  box(80, 0.14, 0.12, 0xa4a8ab, 0, 0.0, Z(1870), null, { cast: false });                 // meio-fio de concreto
  // rua Elizeu de Alvarenga
  box(80, 0.04, (2050 - 1870) * S, C.street, 0, 0.0, Z(1960), null, { cast: false });
  for (var d = -16; d < 16; d += 1.5) box(0.9, 0.01, 0.08, C.white, d, 0.045, Z(1960), null, { cast: false });

  // ---------- Pisos ----------
  // pátio: cimento queimado (cinza médio, manchado, com juntas de dilatação)
  (function(){
    var cv = document.createElement('canvas'); cv.width = cv.height = 512;
    var g = cv.getContext('2d'); g.fillStyle = '#9a9a96'; g.fillRect(0, 0, 512, 512);
    for (var i = 0; i < 70; i++){
      var x = Math.random() * 512, y = Math.random() * 512, r = 30 + Math.random() * 90;
      var gr = g.createRadialGradient(x, y, 0, x, y, r), t = Math.random() < 0.5;
      gr.addColorStop(0, t ? 'rgba(125,125,120,.30)' : 'rgba(180,180,175,.28)'); gr.addColorStop(1, 'rgba(150,150,146,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (var j = 0; j < 1400; j++){ g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '90,90,88' : '200,200,196') + ',.12)'; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
    g.strokeStyle = 'rgba(80,80,78,.55)'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 509, 509);       // junta
    var tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.repeat.set((700 - 40) * S / 3, (1760 - 720) * S / 3);                                        // placa de 3 x 3 m
    rect(40, 720, 700, 1760, 0, 0.05, 0, { cast: false, material: new THREE.MeshStandardMaterial({ map: tx, roughness: 0.9 }) });   // pátio
  })();
  rect(40, 40, 700, 230, 0, 0.06, C.anexo, { cast: false });                 // bloco do anexo
  [[50,255],[265,470],[480,685]].forEach(function(r){ rect(r[0], 50, r[1], 135, 0.06, 0.04, C.salaAnexo, { cast: false }); });
  rect(50, 145, 700, 220, 0.06, 0.04, C.corr, { cast: false });              // corredor do anexo
  rect(630, 220, 700, 320, 0.0, 0.1, C.corr, { cast: false });               // corredor de acesso ao anexo
  // nave: piso de cor clara (porcelanato bege claro, placas de 0,6 m)
  (function(){
    var cv = document.createElement('canvas'); cv.width = cv.height = 128; var g = cv.getContext('2d');
    g.fillStyle = '#f0ebdf'; g.fillRect(0, 0, 128, 128);
    for (var i = 0; i < 160; i++){ g.fillStyle = 'rgba(205,198,182,.18)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); }
    g.strokeStyle = '#d9d2c2'; g.lineWidth = 2; g.strokeRect(1, 1, 126, 126);
    var tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set((700 - 40) * S / 0.6, (720 - 320) * S / 0.6);

      var k = ease(anim.t);
      camera.position.lerpVectors(anim.p0, anim.p1, k);
      controls.target.lerpVectors(anim.t0, anim.t1, k);
      if (anim.t >= 1) anim = null;
    }
    if (window.__fpTick) window.__fpTick();
    var moved = controls.update();
    // DESEMPENHO: só redesenha quando algo muda (câmera, animação, giro, clique/toque); parado, o aparelho descansa
    if (moved || anim || controls.autoRotate || need > 0){ renderer.render(scene, camera); if (need > 0) need--; }
    requestAnimationFrame(tick);
  }
  tick();
  // reflexos do céu: fortes só no vidro/metal; nas demais superfícies só um toque (evita estourar a luz)
  scene.traverse(function(o){
    if (o.isMesh && o.material && o.material.isMeshStandardMaterial) {
      var m = o.material;
      if (m.side === THREE.DoubleSide && m.metalness > 0.2 && m.metalness < 0.5) { m.metalness = 0.12; m.roughness = 0.75; }   // telhado: menos brilho de céu
      m.envMapIntensity = (m.transparent || m.metalness > 0.5 || m.roughness < 0.3) ? 1.0 : 0.28;
    }
  });

  // ---- DESEMPENHO: junta peças estáticas de mesmo material em poucas malhas (de ~1.500 para ~150 chamadas de desenho por quadro) ----
  (function(){
    function mergeStatic(group){
      group.updateMatrixWorld(true);
      var inv = new THREE.Matrix4().copy(group.matrixWorld).invert(), list = [], buckets = {}, order = [];
      group.traverse(function(o){
        var g = o.geometry, a = g && g.attributes;
        if (o.isMesh && o.visible && !Array.isArray(o.material) && a && a.position && a.normal && a.uv && Object.keys(a).length === 3) list.push(o);
      });
      list.forEach(function(o){
        var g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
        g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
        var key = o.material.uuid + (o.castShadow ? 'c' : 'n') + (o.receiveShadow ? 'r' : 'n') + o.renderOrder;
        if (!buckets[key]){ buckets[key] = { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, ro: o.renderOrder, gs: [] }; order.push(key); }
        buckets[key].gs.push(g);
        o.parent.remove(o);
      });
      order.forEach(function(k){
        var b = buckets[k], n = 0, i, off = 0;
        b.gs.forEach(function(g){ n += g.attributes.position.count; });
        var P = new Float32Array(n * 3), N = new Float32Array(n * 3), U = new Float32Array(n * 2), uo = 0;
        b.gs.forEach(function(g){
          P.set(g.attributes.position.array, off * 3); N.set(g.attributes.normal.array, off * 3); U.set(g.attributes.uv.array, uo);
          off += g.attributes.position.count; uo += g.attributes.uv.count * 2; g.dispose();
        });
        var geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(P, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(N, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(U, 2));
        var m = new THREE.Mesh(geo, b.mat); m.castShadow = b.cast; m.receiveShadow = b.recv; m.renderOrder = b.ro; group.add(m);
      });
    }
    scene.children.slice().forEach(function(c){ if (c.isGroup && c !== labelGroup) mergeStatic(c); });
  })();
  window.__ready = true;
})();
</script>
