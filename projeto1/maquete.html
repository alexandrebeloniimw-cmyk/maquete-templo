<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6db5">
<title>Projeto 1 — Maquete 3D</title>
<style>
  :root { --ink:#1f2a37; --muted:#5b6776; --card:rgba(255,255,255,.92); --accent:#2f6db5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); background:#dfeaf5; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .top { position:fixed; left:16px; top:14px; background:var(--card); padding:10px 16px; border-radius:14px; box-shadow:0 4px 18px rgba(30,50,80,.18); max-width:min(70vw,420px); }
  .top h1 { margin:0; font-size:18px; letter-spacing:.2px; }
  .top p { margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  .tools { position:fixed; right:14px; top:14px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:55vw; }
  .bar { position:fixed; left:0; right:0; bottom:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 12px; }
  button { font:inherit; font-size:13.5px; border:0; cursor:pointer; padding:9px 14px; border-radius:999px; background:var(--card); color:var(--ink); box-shadow:0 3px 12px rgba(30,50,80,.18); transition:transform .12s, background .12s; }
  button:hover { transform:translateY(-1px); background:#fff; }
  button.on { background:var(--accent); color:#fff; }
  button.view.active { outline:2px solid var(--accent); }
  .hint { position:fixed; left:50%; transform:translateX(-50%); bottom:64px; font-size:12px; color:#33465c; background:rgba(255,255,255,.7); padding:4px 10px; border-radius:999px; pointer-events:none; white-space:nowrap; }
  @media (max-width:640px){
    .top { left:8px; top:8px; padding:7px 11px; border-radius:11px; max-width:62vw; }
    .top h1 { font-size:14px; } .top p { display:none; }
    .tools { top:auto; bottom:calc(66px + env(safe-area-inset-bottom)); right:8px; gap:6px; flex-wrap:nowrap; max-width:none; }
    .tools button { padding:8px 11px; font-size:12.5px; }
    .bar { bottom:calc(10px + env(safe-area-inset-bottom)); flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:2px 10px 6px; gap:6px; }
    .bar::-webkit-scrollbar { display:none; }
    .bar button { flex:0 0 auto; padding:10px 14px; font-size:13px; white-space:nowrap; }
    .hint { display:none }
  }
  @media (max-width:640px) and (max-height:480px){ .top p{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>Projeto 1 · Maquete 3D</h1><p>Prédio moderno de 2 andares no lugar da cobertura</p></div>
<div class="tools">
  <button id="tUp" class="on">2º andar</button>
  <button id="tRoof" class="on">Telhado</button>
  <button id="tLabels" class="on">Nomes</button>
  <button id="tSpin">Girar</button>
</div>
<div class="hint">Arraste para girar · role ou use dois dedos para aproximar</div>
<div class="bar" id="views"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  // ---------- Conversão planta (px) -> mundo (unidades ~ metros) ----------
  var S = 0.02;                       // 50 px da planta = 1 unidade (~1 m)
  function X(px){ return (px - 370) * S; }
  function Z(py){ return (py - 900) * S; }

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  var SMALL = Math.min(window.innerWidth, window.innerHeight) < 700;      // celular: menos carga gráfica
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, SMALL ? 1.5 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdfeaf5);
  scene.fog = new THREE.Fog(0xdfeaf5, 80, 180);

  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.499;
  controls.minDistance = 1.5;
  controls.maxDistance = 95;
  controls.autoRotateSpeed = 1.2;

  // ---------- Luzes ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9fae98, 0.5));
  var sun = new THREE.DirectionalLight(0xfff1dc, 0.62);
  sun.position.set(18, 34, 22);
  sun.castShadow = true;
  sun.shadow.mapSize.set(SMALL ? 1024 : 2048, SMALL ? 1024 : 2048);
  var sc = sun.shadow.camera; sc.left = -32; sc.right = 32; sc.top = 34; sc.bottom = -30; sc.near = 1; sc.far = 130;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  var inner = new THREE.PointLight(0xfff0d8, 0.28, 24, 1.5); inner.position.set(0, 3.8, -9.5); scene.add(inner);

  // ---------- Materiais ----------
  var cache = {};
  function mat(hex, opts){
    var k = hex + JSON.stringify(opts || {});
    if (!cache[k]) cache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.9, metalness: 0 }, opts || {}));
    return cache[k];
  }
  var C = {
    wall: 0xf3efe6, wallIn: 0xe9e3d6, muro: 0xe6dfd0, trim: 0xb9b2a2,
    anexo: 0xd9d0f0, salaAnexo: 0xf6c3dc, corr: 0xd9d9de, plat1: 0xd2d4d7, plat2: 0xd2d4d7, nave: 0xbfe6dc,
    bath: 0xd9d9de, salaExt: 0xf4a38f, bebedouro: 0xb9d8f2, patio: 0xdfeedd, varanda: 0xf0d3bc,
    grass: 0xc9e0bd, sidewalk: 0xece7dc, street: 0x8e9299, line: 0x5f8f5a, roof: 0x8d9299, wood: 0x8b5e3c, slab: 0xb9b9c3,
    mesa: 0xa9bbd6, white: 0xffffff, grade: 0xffffff, azul: 0x3f78c4, azulClaro: 0x9cc8ee
  };

  var root = new THREE.Group(); scene.add(root);
  var roofGroup = new THREE.Group(); scene.add(roofGroup);
  var labelGroup = new THREE.Group(); scene.add(labelGroup);
  var upperGroup = new THREE.Group(); scene.add(upperGroup);      // 2º andar do prédio (laje, pisos, paredes, janelas, portas)
  var forroGroup = new THREE.Group(); scene.add(forroGroup);      // forros e luzes (somem junto com o telhado)

  function box(w, h, d, color, x, y, z, parent, o){
    o = o || {};
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), o.material || mat(color, o.mat));
    m.position.set(x, y, z);
    m.castShadow = o.cast !== false; m.receiveShadow = true;
    (parent || root).add(m);
    return m;
  }
  // retângulo da planta -> caixa
  function rect(x1, y1, x2, y2, y0, h, color, o){
    return box((x2 - x1) * S, h, (y2 - y1) * S, color, X((x1 + x2) / 2), y0 + h / 2, Z((y1 + y2) / 2), null, o);
  }

  // ---------- Paredes com aberturas ----------
  var T = 0.16, BH = 3.0, DOORH = 2.1;     // BH = altura padrão das paredes (3 m); porta 2,10 m
  var glass = new THREE.MeshStandardMaterial({ color: 0x9fd0ee, transparent: true, opacity: 0.45, roughness: 0.2, metalness: 0.1 });
  // caixa de parede; color 'HALF' = metade de baixo com ladrilhinhos e metade de cima azul claro
  var YOFF = 0;                          // deslocamento vertical (paredes do 2º andar)
  function wbox(horiz, mid, fixed, len, y0, hh, tt, color, material){
    if (color === 'HALF' && !material){
      [[y0, Math.min(y0 + hh, 1.5), true], [Math.max(y0, 1.5), y0 + hh, false]].forEach(function(q){
        var ph = q[1] - q[0]; if (ph <= 0.001) return;
        var mt = q[2] ? tileMat(len / 0.5, ph / 0.5) : mat(C.azulClaro);
        if (horiz) box(len, ph, tt, 0, X(mid), q[0] + ph / 2, Z(fixed), null, { material: mt });
        else box(tt, ph, len, 0, X(fixed), q[0] + ph / 2, Z(mid), null, { material: mt });
      });
      return null;
    }
    return horiz ? box(len, hh, tt, color, X(mid), y0 + YOFF + hh / 2, Z(fixed), null, { material: material })
                 : box(tt, hh, len, color, X(fixed), y0 + YOFF + hh / 2, Z(mid), null, { material: material });
  }
  function opening(horiz, fixed, g, h, color, tt){
    var len = (g.b - g.a) * S, mid = (g.a + g.b) / 2;
    var lh = g.lh || DOORH;
    function piece(y0, y1, material){
      if (y1 <= y0) return;
      var hh = y1 - y0;
      var mesh = wbox(horiz, mid, fixed, len, y0, hh, tt, color, material);
      if (mesh && material === glass) mesh.castShadow = false;
    }
    piece(lh, h, null);
    if (g.sill){ piece(0, g.sill, null); piece(g.sill, lh, glass); }
  }
  function wall(horiz, fixed, a1, a2, h, gaps, color, thick){
    gaps = (gaps || []).slice().sort(function(p, q){ return p.a - q.a; });
    var tt = thick || T, cur = a1;
    function seg(a, b){
      if (b - a <= 0.5) return;
      var len = (b - a) * S, mid = (a + b) / 2;
      wbox(horiz, mid, fixed, len, 0, h, tt, color);
    }
    gaps.forEach(function(g){ seg(cur, g.a); opening(horiz, fixed, g, h, color, tt); cur = g.b; });
    seg(cur, a2);
  }
  function hwall(py, x1, x2, h, gaps, color, thick){ wall(true, py, x1, x2, h, gaps, color || C.wallIn, thick); }
  function vwall(px, y1, y2, h, gaps, color, thick){ wall(false, px, y1, y2, h, gaps, color || C.wallIn, thick); }
  // aberturas padrão: porta 0,90 m (45 px) e janela 1,20 x 1,20 m com peitoril 1,10 m (60 px de largura)
  function door(c){ return { a: c - 22.5, b: c + 22.5, lh: 2.1 }; }
  function win(c){ return { a: c - 30, b: c + 30, sill: 1.1, lh: 2.3 }; }
  // folha de porta de madeira (fechada) e esquadria branca de janela, para as aberturas das salas
  function seg3(horiz, fixed, c, along, h, th, color, y, off){
    off = off || 0;
    if (horiz) box(along, h, th, color, X(c) + off, y + YOFF, Z(fixed));
    else box(th, h, along, color, X(fixed), y + YOFF, Z(c) + off);
  }
  function doorLeaf(horiz, fixed, c, w, h, th){
    w = w || 0.86; h = h || 2.08; th = th || 0.2;
    seg3(horiz, fixed, c, w, h, 0.05, C.wood, h / 2);
    [[0.72 * w, 0.37 * h, 0.72 * h], [0.72 * w, 0.37 * h, 0.28 * h]].forEach(function(q){ seg3(horiz, fixed, c, q[0], q[1], 0.075, 0x6e4a2e, q[2]); });
    seg3(horiz, fixed, c, 0.1, 0.03, 0.12, 0xd8c27a, h * 0.48, w / 2 - 0.12);
    seg3(horiz, fixed, c, w + 0.1, 0.06, th, 0x5b3d25, h + 0.04);
    [-1, 1].forEach(function(o){ seg3(horiz, fixed, c, 0.06, h + 0.02, th, 0x5b3d25, h / 2 + 0.01, o * (w / 2 + 0.03)); });
  }
  function winFrame(horiz, fixed, c){
    var y0 = 1.1, y1 = 2.3, yc = (y0 + y1) / 2;
    seg3(horiz, fixed, c, 1.2, 0.05, 0.2, C.white, y0 + 0.025);
    seg3(horiz, fixed, c, 1.2, 0.05, 0.2, C.white, y1 - 0.025);
    [-0.575, 0.575].forEach(function(o){ seg3(horiz, fixed, c, 0.05, 1.2, 0.2, C.white, yc, o); });
    seg3(horiz, fixed, c, 0.04, 1.2, 0.1, C.white, yc);
    seg3(horiz, fixed, c, 1.3, 0.04, 0.3, C.white, y0 - 0.02);
  }

  // ---------- Terreno, calçada e rua ----------
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), mat(C.grass));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; root.add(ground);
  // calçada (bege com pedrinhas) entre o portão e a rua
  box(80, 0.06, (1870 - 1763) * S, C.sidewalk, 0, 0.0, Z((1763 + 1870) / 2), null, { cast: false });
  box(80, 0.14, 0.12, 0xb9b3a6, 0, 0.0, Z(1870), null, { cast: false });                 // meio-fio
  // rua Elizeu de Alvarenga
  box(80, 0.04, (2050 - 1870) * S, C.street, 0, 0.0, Z(1960), null, { cast: false });
  for (var d = -16; d < 16; d += 1.5) box(0.9, 0.01, 0.08, C.white, d, 0.045, Z(1960), null, { cast: false });
  (function(){
    var n = 420, im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 6, 4), mat(0xb8b09f), n);
    var o = new THREE.Object3D(), seed = 8;
    function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < n; i++){
      o.position.set(-14 + rnd() * 28, 0.05, Z(1766) + rnd() * ((1866 - 1766) * S));
      var s = 0.6 + rnd() * 0.9; o.scale.set(s, 0.45 * s, s * (0.7 + rnd() * 0.4)); o.rotation.y = rnd() * 3; o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    }
    im.receiveShadow = true; root.add(im);
  })();

  // ---------- Pisos ----------
  // pátio: cimento queimado (cinza médio, manchado, com juntas de dilatação)
  (function(){
    var cv = document.createElement('canvas'); cv.width = cv.height = 512;
    var g = cv.getContext('2d'); g.fillStyle = '#9a9a96'; g.fillRect(0, 0, 512, 512);
    for (var i = 0; i < 70; i++){
      var x = Math.random() * 512, y = Math.random() * 512, r = 30 + Math.random() * 90;
      var gr = g.createRadialGradient(x, y, 0, x, y, r), t = Math.random() < 0.5;
      gr.addColorStop(0, t ? 'rgba(125,125,120,.30)' : 'rgba(180,180,175,.28)'); gr.addColorStop(1, 'rgba(150,150,146,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (var j = 0; j < 1400; j++){ g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '90,90,88' : '200,200,196') + ',.12)'; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
    g.strokeStyle = 'rgba(80,80,78,.55)'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 509, 509);       // junta
    var tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.repeat.set((700 - 40) * S / 3, (1760 - 720) * S / 3);                                        // placa de 3 x 3 m
    rect(40, 720, 700, 1760, 0, 0.05, 0, { cast: false, material: new THREE.MeshStandardMaterial({ map: tx, roughness: 0.9 }) });   // pátio
  })();
  rect(40, 40, 700, 230, 0, 0.06, C.anexo, { cast: false });                 // bloco do anexo
  [[50,255],[265,470],[480,685]].forEach(function(r){ rect(r[0], 50, r[1], 135, 0.06, 0.04, C.salaAnexo, { cast: false }); });
  rect(50, 145, 700, 220, 0.06, 0.04, C.corr, { cast: false });              // corredor do anexo
  rect(630, 220, 700, 320, 0.0, 0.1, C.corr, { cast: false });               // corredor de acesso ao anexo
  // nave: piso de cor clara (porcelanato bege claro, placas de 0,6 m)
  (function(){
    var cv = document.createElement('canvas'); cv.width = cv.height = 128; var g = cv.getContext('2d');
    g.fillStyle = '#f0ebdf'; g.fillRect(0, 0, 128, 128);
    for (var i = 0; i < 160; i++){ g.fillStyle = 'rgba(205,198,182,.18)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); }
    g.strokeStyle = '#d9d2c2'; g.lineWidth = 2; g.strokeRect(1, 1, 126, 126);
    var tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set((700 - 40) * S / 0.6, (720 - 320) * S / 0.6);
    rect(40, 320, 700, 720, 0, 0.08, 0, { cast: false, material: new THREE.MeshStandardMaterial({ map: tx, roughness: 0.55 }) });   // nave (Piso)
  })();

  // ---------- Altar: Plataforma 1 (0,20 m) e Plataforma 2 (0,40 m de altura total, degrau de 20 cm) + 1/4 de pizza nos extremos ----------
  rect(40, 274, 630, 320, 0, 0.2, C.plat1);                                  // Plataforma 1 (degrau frontal)
  rect(40, 230, 630, 274, 0, 0.4, C.plat2);                                  // Plataforma 2 (resto do altar)
  (function(){
    var r = 46 * S, geoL = new THREE.CylinderGeometry(r, r, 0.2, 28, 1, false, 0, Math.PI / 2);
    var geoR = new THREE.CylinderGeometry(r, r, 0.2, 28, 1, false, -Math.PI / 2, Math.PI / 2);
    [[geoL, 40], [geoR, 630]].forEach(function(p){
      var m = new THREE.Mesh(p[0], mat(C.plat2)); m.position.set(X(p[1]), 0.3, Z(274)); m.castShadow = true; m.receiveShadow = true; root.add(m);
    });
  })();

  // tapete marrom sobre as Plataformas 1 e 2 (inclusive nos 1/4 de círculo dos extremos)
  (function(){
    var cv = document.createElement('canvas'); cv.width = cv.height = 128; var g = cv.getContext('2d');
    g.fillStyle = '#6a4326'; g.fillRect(0, 0, 128, 128);
    for (var i = 0; i < 900; i++){ g.fillStyle = Math.random() < 0.5 ? 'rgba(40,22,10,.25)' : 'rgba(150,105,65,.22)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); }
    var tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    function tap(x1, y1, x2, y2, top){
      var t = tx.clone(); t.needsUpdate = true; t.repeat.set((x2 - x1) * S / 0.5, (y2 - y1) * S / 0.5);
      box((x2 - x1) * S, 0.025, (y2 - y1) * S, 0, X((x1 + x2) / 2), top + 0.0125, Z((y1 + y2) / 2), null, { cast: false, material: new THREE.MeshStandardMaterial({ map: t, roughness: 1 }) });
    }
    tap(48, 238, 622, 266, 0.4);                       // Plataforma 2
    tap(94, 280, 576, 314, 0.2);                       // Plataforma 1 (entre os 1/4 de círculo)
    var r = 46 * S - 0.06, cm = new THREE.MeshStandardMaterial({ map: tx, roughness: 1 });
    [[new THREE.CylinderGeometry(r, r, 0.025, 28, 1, false, 0, Math.PI / 2), 40], [new THREE.CylinderGeometry(r, r, 0.025, 28, 1, false, -Math.PI / 2, Math.PI / 2), 630]].forEach(function(q){
      var m = new THREE.Mesh(q[0], cm); m.position.set(X(q[1]), 0.4125, Z(274)); m.receiveShadow = true; root.add(m);
    });
  })();

  // ---------- Formas arredondadas (carros e instrumentos) ----------
  function rrShape(w, h, r){
    var sh = new THREE.Shape(), x = -w / 2, y = -h / 2;
    r = Math.min(r, w / 2, h / 2);
    sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
    sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
    return sh;
  }
  function bevelGeo(shape, depth, b){
    var g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.001, depth - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 14 });
    g.translate(0, 0, -(depth - 2 * b) / 2); return g;
  }
  // caixa com cantos e arestas arredondados (w x h x d), centro em (x,y,z)
  function rbox(w, h, d, color, x, y, z, o){
    o = o || {}; var b = Math.min(o.b || 0.04, w / 4, h / 4, d / 4);
    var m = new THREE.Mesh(bevelGeo(rrShape(w - 2 * b, h - 2 * b, o.r || 0.06), d, b), o.material || mat(color, o.mat));
    m.position.set(x, y, z); m.castShadow = o.cast !== false; m.receiveShadow = true; root.add(m); return m;
  }
  // ---------- Muros: metade de cima azul, metade de baixo com ladrilhinhos ----------
  var tileCv = document.createElement('canvas'); tileCv.width = tileCv.height = 128;
  (function(){
    var g = tileCv.getContext('2d'); g.fillStyle = '#b8aa94'; g.fillRect(0, 0, 128, 128);
    for (var i = 0; i < 4; i++) for (var j = 0; j < 4; j++){
      g.fillStyle = ((i + j) % 2 ? '#efe2c9' : '#e6d6b9'); g.fillRect(i * 32 + 2, j * 32 + 2, 28, 28);
    }
  })();
  function tileMat(rx, ry){
    var t = new THREE.CanvasTexture(tileCv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    return new THREE.MeshStandardMaterial({ map: t, roughness: 0.85 });
  }
  // muro: horiz=true segue o eixo X (largura len); false segue o eixo Z
  function muro(horiz, cx, cz, len, h, th){
    var w = horiz ? len : th, d = horiz ? th : len;
    box(w, h / 2, d, 0, cx, h / 4, cz, null, { material: tileMat(len / 0.5, (h / 2) / 0.5) });
    box(w, h / 2, d, C.azul, cx, h * 3 / 4, cz);
  }
  // ---------- Instrumentos sobre a Plataforma 2 (topo a 0,40 m) ----------
  (function(){
    var P = 0.4, ink = mat(0x22262b, { roughness: 0.5 }), metal = mat(0xc9cdd2, { roughness: 0.3, metalness: 0.6 });
    function cyl(rt, rb, h, color, x, y, z, rx, rz, mm){
